name: Verificação de segredos

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
        env:
          VERSAO: 8.30.1

      - name: Definir intervalo de commits
        id: intervalo
        run: |
          if [ "$EVENTO" = "pull_request" ]; then
            echo "range=$BASE..$HEAD" >> "$GITHUB_OUTPUT"
          elif [ "$ANTES" = "0000000000000000000000000000000000000000" ]; then
            echo "range=-1" >> "$GITHUB_OUTPUT"
          else
            echo "range=$ANTES..$HEAD" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}

      # Só os commits deste push/PR: o histórico antigo não entra no escopo,
      # então segredos já corrigidos não voltam a aparecer como alerta.
      - name: Procurar segredos nos commits novos
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts "${{ steps.intervalo.outputs.range }}" \
            --redact \
            --no-banner \
            --verbose
